name: ScienceChat images

on:
  workflow_dispatch:
  push:
    tags:
      - 'sciencechat-v*'

permissions:
  contents: read
  packages: write

concurrency:
  group: sciencechat-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            file: service/Dockerfile.api
            target: production
            build_args: ''
          - name: worker
            file: service/Dockerfile.worker
            target: production
            build_args: ''
          # Hardened libkrun/microVM image. Requires a KVM-capable node and
          # packages.source=image in the Helm release.
          - name: sandbox
            file: api/Dockerfile
            target: sandbox-runner-baked
            build_args: PYTHON_VERSION=3.12.12
          # Evaluation-only direct NsJail image for clusters without /dev/kvm.
          # It shares the Kubernetes node kernel and requires the matching
          # package-init image plus packages.source=pvc.
          - name: sandbox-nsjail
            file: api/Dockerfile
            target: sandbox-runner
            build_args: PYTHON_VERSION=3.12.12
          - name: package-init
            file: docker/Dockerfile.package-init
            target: ''
            build_args: PYTHON_VERSION=3.12.12
          - name: file-server
            file: service/Dockerfile
            target: production
            build_args: ''
          - name: tool-call-server
            file: service/Dockerfile.tool-call-server
            target: production
            build_args: ''
          - name: egress-gateway
            file: service/Dockerfile.egress-gateway
            target: production
            build_args: ''

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image metadata
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sciencechat-codeapi-${{ matrix.name }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          build-args: ${{ matrix.build_args }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: true
          sbom: true
